AWSTemplateFormatVersion: '2010-09-09'
Description: 'Healthcare AI Platform - Cost-Optimized Production Deployment on AWS EC2 (Single-Instance Architecture)'

Parameters:
  InstanceType:
    Type: String
    Default: 't3.small'
    AllowedValues:
      - 't3.small'
      - 't3.micro'
      - 'c7i-flex.large'
      - 'm7i-flex.large'
    Description: 'EC2 Instance Type (t3.small recommended for Free Tier eligibility).'

  VpcId:
    Type: 'AWS::EC2::VPC::Id'
    Default: 'vpc-088cd08bc401eedb1'
    Description: 'VPC ID for deployment'

  SubnetId:
    Type: 'AWS::EC2::Subnet::Id'
    Default: 'subnet-00aeba8d1006196d9'
    Description: 'Subnet ID for the EC2 server'

  KeyPairName:
    Type: String
    Default: ''
    Description: '(Optional) Existing EC2 Key Pair for SSH access. Leave empty if using AWS Systems Manager.'

  LatestUbuntuAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
    Description: 'Auto-resolved Ubuntu 24.04 LTS AMI from Canonical.'

  AdminEmail:
    Type: String
    Default: 'mdzeeshank578@gmail.com'
    Description: 'Administrator email for initial PHC seed account.'

  AdminName:
    Type: String
    Default: 'zeeshan'
    Description: 'Administrator full name.'

Resources:
  HealthcareSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Security Group for Healthcare AI Platform'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'HTTP (Doctor Dashboard & Web API)'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS (Doctor Dashboard & Mobile API)'
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: 'SSH Access'
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          CidrIp: 0.0.0.0/0
          Description: 'Backend API access'
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
          Description: 'AI Microservice docs'
      Tags:
        - Key: Name
          Value: 'healthcare-ai-sg'

  HealthcareInstanceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Tags:
        - Key: Name
          Value: 'healthcare-ai-role'

  HealthcareInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Roles:
        - !Ref HealthcareInstanceRole

  HealthcareElasticIP:
    Type: 'AWS::EC2::EIP'
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: 'healthcare-ai-eip'

  HealthcareServer:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestUbuntuAmiId
      SubnetId: !Ref SubnetId
      KeyName: !If [HasKeyName, !Ref KeyPairName, !Ref 'AWS::NoValue']
      IamInstanceProfile: !Ref HealthcareInstanceProfile
      SecurityGroupIds:
        - !GetAtt HealthcareSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: 'healthcare-ai-production-server'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # 1. Update and install packages
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg lsb-release git unzip

          # Setup 2GB Swap for low-cost Free Tier instances
          fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          # 2. Install Docker & Docker Compose
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable docker
          systemctl start docker

          # 3. Clone Repository
          mkdir -p /opt/healthcare
          cd /opt/healthcare
          git clone https://github.com/mdzeeshank578/healthcare-ai-Zeeshan.git app || git clone https://github.com/Aayush3689/smart-healthcare-system.git app
          cd app

          # 4. Generate Production .env file
          DB_PASS=$(openssl rand -hex 16)
          cat <<EOF > .env.production
          NODE_ENV=production
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=$DB_PASS
          POSTGRES_DB=smart_healthcare
          DATABASE_URL="postgresql://postgres:$DB_PASS@postgres:5432/smart_healthcare?schema=public"
          PORT=4000
          JWT_SECRET=$(openssl rand -hex 32)
          CORS_ORIGINS=*
          AI_SERVICE_URL=http://ai-service:8000
          AI_SERVICE_TIMEOUT_MS=15000

          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=465
          SMTP_SECURE=true
          SMTP_FROM="Smart Healthcare <healthcare08082026@gmail.com>"
          SMTP_USER=healthcare08082026@gmail.com
          SMTP_PASSWORD=cphyzkovqtrrhzqf

          SEED_PHC_CODE=PHC-PROD-001
          SEED_PHC_NAME="Primary Health Centre Production"
          SEED_PHC_ADDRESS="Sector 1, Medical Hub"
          SEED_PHC_DISTRICT="Central"
          SEED_PHC_STATE="State"
          SEED_ADMIN_EMAIL="${AdminEmail}"
          SEED_ADMIN_NAME="${AdminName}"
          VITE_API_BASE_URL=/api/v1
          EOF

          # 5. Ensure docker-compose.prod.yml includes all microservices
          cat <<'EOF' > docker-compose.prod.yml
          services:
            postgres:
              image: postgres:16-alpine
              container_name: smart-healthcare-postgres-prod
              restart: unless-stopped
              env_file:
                - .env.production
              environment:
                POSTGRES_USER: ${!POSTGRES_USER}
                POSTGRES_PASSWORD: ${!POSTGRES_PASSWORD}
                POSTGRES_DB: ${!POSTGRES_DB}
              ports:
                - "5433:5432"
              volumes:
                - smart-healthcare-postgres-prod-data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
                interval: 10s
                timeout: 5s
                retries: 5

            ai-service:
              build:
                context: apps/ai-service
                dockerfile: Dockerfile
              container_name: smart-healthcare-ai-service-prod
              restart: unless-stopped
              ports:
                - "8000:8000"
              healthcheck:
                test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 20s

            backend:
              build:
                context: .
                dockerfile: apps/backend/Dockerfile
              container_name: smart-healthcare-backend-prod
              restart: unless-stopped
              env_file:
                - .env.production
              environment:
                NODE_ENV: production
                DATABASE_URL: postgresql://${!POSTGRES_USER}:${!POSTGRES_PASSWORD}@postgres:5432/${!POSTGRES_DB}?schema=public
                AI_SERVICE_URL: http://ai-service:8000
              ports:
                - "4000:4000"
              depends_on:
                postgres:
                  condition: service_healthy
                ai-service:
                  condition: service_healthy
              healthcheck:
                test:
                  [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                  ]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 15s

            doctor-dashboard:
              build:
                context: apps/doctor-dashboard
                dockerfile: Dockerfile
                args:
                  VITE_API_BASE_URL: /api/v1
              container_name: smart-healthcare-doctor-dashboard-prod
              restart: unless-stopped
              ports:
                - "80:80"
              depends_on:
                backend:
                  condition: service_healthy

          volumes:
            smart-healthcare-postgres-prod-data:
          EOF

          # 6. Build and launch all services with Docker Compose
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

          # 7. Setup systemd auto-restart service on reboot
          cat <<'SERVICE' > /etc/systemd/system/healthcare-app.service
          [Unit]
          Description=Healthcare AI Platform Production Stack
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/healthcare/app
          ExecStart=/usr/bin/docker compose --env-file .env.production -f docker-compose.prod.yml up -d
          ExecStop=/usr/bin/docker compose --env-file .env.production -f docker-compose.prod.yml down

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable healthcare-app.service

  HealthcareEIPAssociation:
    Type: 'AWS::EC2::EIPAssociation'
    Properties:
      InstanceId: !Ref HealthcareServer
      EIP: !Ref HealthcareElasticIP

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyPairName, '']]

Outputs:
  PublicIP:
    Description: 'Public Elastic IP of the Healthcare AI Server'
    Value: !Ref HealthcareElasticIP

  DoctorDashboardURL:
    Description: 'Access Doctor Dashboard in your web browser'
    Value: !Sub 'http://${HealthcareElasticIP}'

  BackendAPIHealthURL:
    Description: 'Backend API Health Endpoint'
    Value: !Sub 'http://${HealthcareElasticIP}/api/v1/health'

  AIMicroserviceDocsURL:
    Description: 'AI Microservice Interactive Swagger Docs'
    Value: !Sub 'http://${HealthcareElasticIP}:8000/docs'
